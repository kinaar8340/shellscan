[package]
name = "shellscan"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["kinaar8340"]
description = "Phosphor Loom — The Realism Interface (a 3D CRT). qga_pixel + two-clock write. qga-gpu owns the frame."
repository = "https://github.com/kinaar8340/shellscan"
readme = "README.md"

[dependencies]
# Thin scene crate. Do not path-dep inner_cone or flux_trajectoid.
# Do not enable qga-gpu/qga-math — no fiber conversion in this crate.
# Same two revs as inner_cone. No v0.1.0. Do not float main.
qga-math = { git = "https://github.com/kinaar8340/qga_engine", rev = "7e7866bb2611d4ab35e6e3c1f46a3f8dd9b4320d" }
qga-gpu = { git = "https://github.com/kinaar8340/qga_gpu", rev = "b9c999406e266a585769a4804c6968de0e6d2237", features = ["winit", "headless", "capture", "glow"] }
glam = "0.29"
bytemuck = { version = "1.22", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[lib]
name = "shellscan"
path = "src/lib.rs"

[[bin]]
name = "shellscan"
path = "src/bin/shellscan.rs"

[[bin]]
name = "pick"
path = "src/bin/pick.rs"
